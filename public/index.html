<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>VoxelCraft</title>
<style>
  :root{--bg:#10161d;--ink:#e9efe4;--moss:#5c9e3a;--clay:#b5734a;--panel:rgba(16,22,29,.78)}
  *{box-sizing:border-box;touch-action:none;user-select:none}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",Verdana,sans-serif}
  canvas{display:block}

  button{font:inherit;cursor:pointer}
  #start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7vh;background:#3a82dc;z-index:10;text-align:center;padding:20px;overflow:hidden}
  #mbg{position:absolute;inset:0;overflow:hidden;z-index:0}
  .mbl{position:absolute;inset:0;will-change:transform;transition:transform .3s ease-out}
  .mbl canvas{position:absolute;left:-48px;top:-48px;display:block;image-rendering:pixelated}
  .mbl canvas.clouds{animation:drift 320s linear infinite}
  @keyframes drift{to{transform:translateX(-50%)}}

  #logo{position:relative;z-index:1;width:min(92vw,800px);animation:float 5s ease-in-out infinite}
  #logo canvas{display:block;width:100%;height:auto;image-rendering:pixelated;filter:drop-shadow(0 8px 0 rgba(0,0,0,.25))}
  #splash{position:absolute;right:3%;bottom:-16%;color:#ffe14a;font:700 clamp(13px,2.4vw,22px) "Lucida Console","Courier New",monospace;
    text-shadow:2px 2px 0 #3d3200;white-space:nowrap;pointer-events:none;transform:rotate(-16deg);animation:pulse .7s ease-in-out infinite alternate}
  @keyframes pulse{from{transform:rotate(-16deg) scale(1)}to{transform:rotate(-16deg) scale(1.1)}}
  @keyframes float{50%{transform:translateY(-6px)}}

  #menu{position:relative;z-index:1;width:min(380px,84vw);display:flex;flex-direction:column;gap:12px}
  #menu .row{display:flex;gap:12px}#menu .row .mbtn{flex:1;font-size:14px}
  .mbtn{width:100%;height:46px;border:0;border-radius:0;color:#fff;font:700 17px/1 "Lucida Console","Courier New",monospace;letter-spacing:.5px;
    text-shadow:2px 2px 0 #3b3b3b;background:#8b8b8b;box-shadow:0 0 0 3px #111,inset 3px 3px 0 #c6c6c6,inset -3px -3px 0 #555}
  .mbtn:hover{background:#98a3c6;box-shadow:0 0 0 3px #fff,inset 3px 3px 0 #d9e0f5,inset -3px -3px 0 #55607f}
  .mbtn.go{background:#5c9e3a;box-shadow:0 0 0 3px #111,inset 3px 3px 0 #8fd35e,inset -3px -3px 0 #2f5a1c}
  .mbtn.go:hover{background:#6db648;box-shadow:0 0 0 3px #fff,inset 3px 3px 0 #a6e676,inset -3px -3px 0 #2f5a1c}
  .mbtn:active{transform:translateY(2px)}
  .mbtn:disabled{filter:grayscale(.6) brightness(.85);cursor:wait;transform:none}
  #ver{position:absolute;left:10px;bottom:8px;z-index:1;font:12px "Lucida Console",monospace;color:#fff;text-shadow:1px 1px 0 #000}

  #ctl{position:absolute;inset:0;z-index:5;display:none;align-items:center;justify-content:center;background:rgba(8,14,24,.62);padding:12px}
  #ctl .box{width:min(560px,96vw);max-height:92vh;overflow:auto;touch-action:pan-y;padding:18px 18px 16px;text-align:left;border-radius:4px;
    background:repeating-linear-gradient(0deg,#9a6735 0 21px,#6f4623 21px 24px);box-shadow:0 0 0 3px #1f1008,inset 0 0 0 3px #b9803f,0 10px 0 0 #0005}
  #ctl h2{margin:0 0 12px;text-align:center;font:700 18px "Lucida Console","Courier New",monospace;letter-spacing:3px;color:#fff3d6;text-shadow:2px 2px 0 #1f1008}
  #ctl .g{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;align-items:center;padding:12px;background:#2a1b12;box-shadow:inset 2px 2px #100803,inset -2px -2px #54391f}
  #ctl kbd{justify-self:start;font:700 12px "Lucida Console",monospace;color:#2a1b12;background:#e9dcc0;padding:3px 7px;box-shadow:inset -2px -2px #a79468,0 0 0 2px #100803}
  #ctl .g span{color:#fff3d6;font-size:14px}
  #ctl p{margin:10px 2px 14px;color:#fff3d6;font-size:13px}

  #hud{position:fixed;inset:0;pointer-events:none;display:none}
  #cross{position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px;
    background:linear-gradient(#fff,#fff) center/2px 100% no-repeat,linear-gradient(#fff,#fff) center/100% 2px no-repeat;mix-blend-mode:difference}
  #hotbar{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:4px;pointer-events:auto}
  .slot{width:46px;height:46px;border:3px solid #333;background:var(--panel);border-radius:3px;display:flex;align-items:center;justify-content:center}
  .slot.on{border-color:#fff}
  .slot i{display:block;width:28px;height:28px;border:2px solid rgba(0,0,0,.5)}
  #info{position:absolute;top:8px;left:8px;font-size:12px;background:var(--panel);padding:6px 10px;border-radius:4px;line-height:1.5}
  #chatlog{position:absolute;left:8px;bottom:70px;font-size:13px;max-width:60%;text-shadow:1px 1px 2px #000}
  #chatbox{position:absolute;left:8px;bottom:70px;display:none;pointer-events:auto;width:50%}
  #chatbox input{width:100%;padding:6px;background:var(--panel);border:1px solid #fff;color:#fff;user-select:text}
  #mobile{position:fixed;inset:0;display:none;pointer-events:none}
  #stick{position:absolute;left:24px;bottom:84px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.3);pointer-events:auto}
  #knob{position:absolute;left:36px;top:36px;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.5)}
  .mb{position:absolute;right:20px;width:62px;height:62px;border-radius:50%;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.4);
    color:#fff;font-size:12px;pointer-events:auto}
  #bJump{bottom:150px;right:96px}#bBreak{bottom:90px;right:20px}#bPlace{bottom:170px;right:20px}
</style>
</head>
<body>
<div id="start">
  <div id="mbg"></div>
  <div id="logo"><span id="splash"></span></div>
  <div id="menu">
    <button id="play" class="mbtn go">Play</button>
    <div class="row"><button id="bCtl" class="mbtn">Controls</button><button id="bFs" class="mbtn">Fullscreen</button></div>
  </div>
  <div id="ver">VoxelCraft 1.0</div>
  <div id="ctl"><div class="box">
    <h2>CONTROLS</h2>
    <div class="g">
      <kbd>W A S D</kbd><span>Move</span><kbd>Double W</kbd><span>Sprint</span><kbd>Shift</kbd><span>Sneak</span><kbd>Space</kbd><span>Jump / swim</span>
      <kbd>Left click</kbd><span>Mine / attack (hold)</span><kbd>Right click</kbd><span>Place · eat · open table</span>
      <kbd>1-9 / wheel</kbd><span>Hotbar</span><kbd>E</kbd><span>Inventory</span><kbd>Q</kbd><span>Drop item</span><kbd>F</kbd><span>Eat</span><kbd>T</kbd><span>Chat</span>
    </div>
    <p>Mobile: joystick on the left, drag to look around and use the on-screen buttons.</p>
    <button id="bBack" class="mbtn">Back</button>
  </div></div>
</div>
<div id="hud">
  <div id="cross"></div><div id="info"></div><div id="chatlog"></div>
  <div id="chatbox"><input maxlength="120" placeholder="Message, Enter to send"></div>
  <div id="hotbar"></div>
</div>
<div id="mobile">
  <div id="stick"><div id="knob"></div></div>
  <button class="mb" id="bJump">Jump</button>
  <button class="mb" id="bBreak">Break</button>
  <button class="mb" id="bPlace">Place</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="game.js"></script>
<script src="terrain.js"></script>
<script src="textures.js"></script>
<script src="menu.js"></script>
<script src="items.js"></script>
<script src="physics.js"></script>
<script src="hand.js"></script>
<script src="entities.js"></script>
<script src="animals/animals.js"></script>
<script src="animals/sheep/sheep.js"></script>
<script src="ui.js"></script>
<script src="survival.js"></script>
<script src="atmosphere.js"></script>
<script src="torch.js"></script>
<script src="chest.js"></script>
</body>
</html>
